name: Backend quality checks

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" ruff pip-audit

      - name: Lint
        run: ruff check ujexa_api tests

      - name: Run backend tests
        env:
          UJEXA_ENV: development
        run: pytest -q

      - name: Audit dependencies
        run: pip-audit
