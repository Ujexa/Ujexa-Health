name: Build Ujexa Health Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/patient_mobile/**'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'apps/patient_mobile/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/patient_mobile
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          cache: true

      - name: Generate Android platform project if missing
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.ujexa.health --project-name ujexa_health .
          fi

      - name: Prepare launcher artwork and app identity
        shell: bash
        run: |
          python3 -m pip install --user Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Image.open("assets/ujexa_health_mark.png").convert("RGBA")
          canvas = Image.new("RGBA", (512, 512), (0, 0, 0, 0))
          source.thumbnail((340, 340), Image.Resampling.LANCZOS)
          canvas.alpha_composite(source, ((512 - source.width) // 2, (512 - source.height) // 2))
          output = Path("assets/ujexa_health_launcher_foreground.png")
          canvas.save(output, optimize=True)
          print(f"Prepared padded adaptive launcher foreground: {output}")

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text()
          import re
          xml, count = re.subn(r'android:label="[^"]+"', 'android:label="Ujexa Health"', xml, count=1)
          if count != 1:
              raise SystemExit("Could not set Android application label")
          manifest.write_text(xml)
          print("Android launcher label set to Ujexa Health")
          PY

      - name: Configure Android release build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app_dir = Path("android/app")
          gradle_kts = app_dir / "build.gradle.kts"
          gradle_groovy = app_dir / "build.gradle"

          if gradle_kts.is_file():
              gradle_file = gradle_kts
              source = gradle_file.read_text()
              compile_pattern = r"(?m)^\s*compileOptions\s*\{"
              flag = "isCoreLibraryDesugaringEnabled = true"
              required = [
                  'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")',
                  'implementation("com.google.mlkit:text-recognition-chinese:16.0.1")',
                  'implementation("com.google.mlkit:text-recognition-devanagari:16.0.1")',
                  'implementation("com.google.mlkit:text-recognition-japanese:16.0.1")',
                  'implementation("com.google.mlkit:text-recognition-korean:16.0.1")',
              ]
          elif gradle_groovy.is_file():
              gradle_file = gradle_groovy
              source = gradle_file.read_text()
              compile_pattern = r"(?m)^\s*compileOptions\s*\{"
              flag = "coreLibraryDesugaringEnabled true"
              required = [
                  "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'",
                  "implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'",
                  "implementation 'com.google.mlkit:text-recognition-devanagari:16.0.1'",
                  "implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'",
                  "implementation 'com.google.mlkit:text-recognition-korean:16.0.1'",
              ]
          else:
              raise SystemExit("Flutter did not generate android/app/build.gradle(.kts)")

          compile_options = re.search(compile_pattern, source)
          if not compile_options:
              raise SystemExit(f"Missing compileOptions block in {gradle_file}")
          if flag not in source:
              insert_at = compile_options.end()
              source = source[:insert_at] + "\n        " + flag + source[insert_at:]

          dependencies = re.search(r"(?m)^dependencies\s*\{", source)
          if dependencies:
              opening = source.find("{", dependencies.start())
              depth = 0
              closing = None
              for index in range(opening, len(source)):
                  if source[index] == "{":
                      depth += 1
                  elif source[index] == "}":
                      depth -= 1
                      if depth == 0:
                          closing = index
                          break
              if closing is None:
                  raise SystemExit("Unclosed dependencies block in generated Gradle file")
              block = source[opening + 1:closing]
              additions = [line for line in required if line not in block]
              if additions:
                  source = source[:closing] + "\n    " + "\n    ".join(additions) + "\n" + source[closing:]
          else:
              source = source.rstrip() + "\n\ndependencies {\n    " + "\n    ".join(required) + "\n}\n"

          for dependency in required:
              if dependency not in source:
                  raise SystemExit(f"Required Android dependency missing: {dependency}")
          if flag not in source:
              raise SystemExit("Core library desugaring flag was not configured")

          gradle_file.write_text(source)
          print(f"Configured Android release dependencies in {gradle_file}")
          print("--- Android app Gradle configuration ---")
          print(source)
          PY

      - name: Enable microphone permission for voice notes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.is_file():
              raise SystemExit("Generated Android manifest is missing")
          source = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.RECORD_AUDIO" />'
          if permission not in source:
              marker = '<application'
              if marker not in source:
                  raise SystemExit("Android manifest has no application element")
              source = source.replace(marker, permission + "\n    " + marker, 1)
              manifest.write_text(source)
          print("Microphone permission is configured for voice notes")
          PY

      - name: Remove generated placeholder widget test
        shell: bash
        run: |
          # Flutter creates a template test that references MyApp, which this app does not define.
          if [ -f test/widget_test.dart ] && grep -q "MyApp" test/widget_test.dart; then
            rm test/widget_test.dart
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate branded Android launcher icons
        run: dart run flutter_launcher_icons

      - name: Record resolved dependency graph
        run: flutter pub deps --style=compact

      - name: Run static analysis
        run: flutter analyze --no-fatal-infos --fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --verbose

      - name: Verify release APK
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK" > "$APK.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ujexa-health-android-apk
          path: |
            apps/patient_mobile/build/app/outputs/flutter-apk/app-release.apk
            apps/patient_mobile/build/app/outputs/flutter-apk/app-release.apk.sha256
            apps/patient_mobile/pubspec.lock
          if-no-files-found: error
          retention-days: 14
