name: Build Ujexa Health Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/patient_mobile/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/patient_mobile
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          cache: true

      - name: Generate Android platform project if missing
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.ujexa.health --project-name ujexa_health .
          fi

      - name: Enable Android core library desugaring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path("android/app")
          kotlin = app / "build.gradle.kts"
          groovy = app / "build.gradle"

          if kotlin.exists():
              path = kotlin
              source = path.read_text()
              compile_block = "compileOptions {"
              dependency_block = "dependencies {"
              if "isCoreLibraryDesugaringEnabled" not in source:
                  if compile_block not in source:
                      raise SystemExit("Could not find compileOptions in build.gradle.kts")
                  source = source.replace(
                      compile_block,
                      compile_block + "\n        isCoreLibraryDesugaringEnabled = true",
                      1,
                  )
              if "desugar_jdk_libs" not in source:
                  if dependency_block not in source:
                      raise SystemExit("Could not find dependencies in build.gradle.kts")
                  source = source.replace(
                      dependency_block,
                      dependency_block + '\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")',
                      1,
                  )
          elif groovy.exists():
              path = groovy
              source = path.read_text()
              if "coreLibraryDesugaringEnabled" not in source:
                  marker = "compileOptions {"
                  if marker not in source:
                      raise SystemExit("Could not find compileOptions in build.gradle")
                  source = source.replace(
                      marker,
                      marker + "\n        coreLibraryDesugaringEnabled true",
                      1,
                  )
              if "desugar_jdk_libs" not in source:
                  marker = "dependencies {"
                  if marker not in source:
                      raise SystemExit("Could not find dependencies in build.gradle")
                  source = source.replace(
                      marker,
                      marker + "\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'",
                      1,
                  )
          else:
              raise SystemExit("No Android app Gradle build file found")

          path.write_text(source)
          print(f"Enabled core library desugaring in {path}")
          PY

      - name: Remove generated placeholder widget test
        shell: bash
        run: |
          # flutter create generates a starter test that assumes a MyApp widget.
          # Ujexa Health boots through main() and does not define that template widget.
          if [ -f test/widget_test.dart ] && grep -q "MyApp" test/widget_test.dart; then
            rm test/widget_test.dart
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Record resolved dependency graph
        run: flutter pub deps --style=compact

      - name: Run static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Generate artifact checksum
        run: sha256sum build/app/outputs/flutter-apk/app-release.apk > build/app/outputs/flutter-apk/app-release.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ujexa-health-android-apk
          path: |
            apps/patient_mobile/build/app/outputs/flutter-apk/app-release.apk
            apps/patient_mobile/build/app/outputs/flutter-apk/app-release.apk.sha256
            apps/patient_mobile/pubspec.lock
          if-no-files-found: error
          retention-days: 14
