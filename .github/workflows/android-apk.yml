name: Build Ujexa Health Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/patient_mobile/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/patient_mobile
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          cache: true

      - name: Generate Android platform project if missing
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.ujexa.health --project-name ujexa_health .
          fi

      - name: Configure Android release build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app_dir = Path("android/app")
          gradle_kts = app_dir / "build.gradle.kts"
          gradle_groovy = app_dir / "build.gradle"

          if gradle_kts.is_file():
              gradle_file = gradle_kts
              source = gradle_file.read_text()
              compile_options = re.search(r"(?m)^\\s*compileOptions\\s*\\{", source)
              if not compile_options:
                  raise SystemExit(f"Missing compileOptions block in {gradle_file}")

              if "isCoreLibraryDesugaringEnabled" not in source:
                  insert_at = compile_options.end()
                  source = source[:insert_at] + "\\n        isCoreLibraryDesugaringEnabled = true" + source[insert_at:]

              if "desugar_jdk_libs" not in source:
                  source = source.rstrip() + (
                      '\\n\\ndependencies {\\n'
                      '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\\n'
                      '}\\n'
                  )

          elif gradle_groovy.is_file():
              gradle_file = gradle_groovy
              source = gradle_file.read_text()
              compile_options = re.search(r"(?m)^\\s*compileOptions\\s*\\{", source)
              if not compile_options:
                  raise SystemExit(f"Missing compileOptions block in {gradle_file}")

              if "coreLibraryDesugaringEnabled" not in source:
                  insert_at = compile_options.end()
                  source = source[:insert_at] + "\\n        coreLibraryDesugaringEnabled true" + source[insert_at:]

              if "desugar_jdk_libs" not in source:
                  source = source.rstrip() + (
                      "\\n\\ndependencies {\\n"
                      "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\\n"
                      "}\\n"
                  )
          else:
              raise SystemExit("Flutter did not generate android/app/build.gradle(.kts)")

          if "desugar_jdk_libs:2.1.4" not in source:
              raise SystemExit("Desugaring dependency was not configured")
          if not ("isCoreLibraryDesugaringEnabled = true" in source or
                  "coreLibraryDesugaringEnabled true" in source):
              raise SystemExit("Core library desugaring flag was not configured")

          gradle_file.write_text(source)
          print(f"Configured core library desugaring in {gradle_file}")
          print("--- Android app Gradle configuration ---")
          print(source)
          PY

      - name: Remove generated placeholder widget test
        shell: bash
        run: |
          # Flutter creates a template test that references MyApp, which this app does not define.
          if [ -f test/widget_test.dart ] && grep -q "MyApp" test/widget_test.dart; then
            rm test/widget_test.dart
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Record resolved dependency graph
        run: flutter pub deps --style=compact

      - name: Run static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --verbose

      - name: Verify release APK
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK" > "$APK.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ujexa-health-android-apk
          path: |
            apps/patient_mobile/build/app/outputs/flutter-apk/app-release.apk
            apps/patient_mobile/build/app/outputs/flutter-apk/app-release.apk.sha256
            apps/patient_mobile/pubspec.lock
          if-no-files-found: error
          retention-days: 14
